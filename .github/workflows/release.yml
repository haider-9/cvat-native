name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            qt-version: '6.8.3'
            qt-arch: linux_gcc_64
          - runner: windows-2022
            platform: windows
            qt-version: '6.8.3'
            qt-arch: win64_msvc2022_64

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: ${{ matrix.qt-arch }}
          target: desktop
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev zip patchelf

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            root="$(pwd -W)/package-root"
            root="${root//\\//}"
            tests=OFF
          else
            root="$PWD/package-root"
            tests=ON
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$root" \
            -DCVATNATIVE_BUILD_TESTS="$tests"

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Test
        if: runner.os == 'Linux'
        run: ctest --test-dir build-ci --output-on-failure

      - name: Install
        run: cmake --install build-ci

      - name: Bundle Qt runtime (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/deploy-linux.sh "$PWD/package-root" "$QT_ROOT_DIR"

      - name: Deploy Qt DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: windeployqt --release --no-translations --dir package-root package-root/cvat-native.exe

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: |
          # The generated .desktop entry uses the staging prefix from the runner;
          # released archives rely on the binary being on PATH instead.
          sed -i 's|^Exec=.*|Exec=cvat-native %F|' package-root/share/applications/cvat-native.desktop
          cd package-root
          zip -r "../cvat-native-${GITHUB_REF_NAME}-linux-x86_64.zip" .

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path 'package-root/*' `
            -DestinationPath "cvat-native-$env:GITHUB_REF_NAME-windows-x86_64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cvat-native-*-linux-x86_64.zip
            cvat-native-*-windows-x86_64.zip
