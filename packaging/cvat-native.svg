<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App icon squircle background -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Annotation Bounding Box -->
  <rect x="28" y="28" width="72" height="72" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="url(#boxGrad)" stroke-width="3" stroke-dasharray="6 3"/>

  <!-- Bounding box corner handles -->
  <rect x="24" y="24" width="8" height="8" rx="2" fill="#38bdf8"/>
  <rect x="96" y="24" width="8" height="8" rx="2" fill="#38bdf8"/>
  <rect x="24" y="96" width="8" height="8" rx="2" fill="#38bdf8"/>
  <rect x="96" y="96" width="8" height="8" rx="2" fill="#38bdf8"/>

  <!-- Center Crosshair Target -->
  <circle cx="64" cy="64" r="16" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="3" fill="#22c55e"/>
  <line x1="64" y1="42" x2="64" y2="50" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="78" x2="64" y2="86" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="64" x2="50" y2="64" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="64" x2="86" y2="64" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Polygon node overlay -->
  <path d="M44 80 L76 48 L90 74" fill="none" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="80" r="3" fill="#eab308"/>
  <circle cx="76" cy="48" r="3" fill="#eab308"/>
  <circle cx="90" cy="74" r="3" fill="#eab308"/>
</svg>
